<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FilterLab — non-AI image effects</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◧</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar">
  <div class="logo">◧ Filter<b>Lab</b></div>
  <div class="actions">
    <button id="btn-open">Open image…</button>
    <button id="btn-compare" disabled>Before / After</button>
    <button id="btn-export" class="primary" disabled>Export PNG</button>
  </div>
  <input type="file" id="file-input" accept="image/*" hidden>
</header>

<main>
  <section id="canvas-area">
    <div id="dropzone">
      <div class="dz-icon">＋</div>
      <p class="dz-title">Drop an illustration here</p>
      <p class="dz-sub">or click to browse · you can also paste from clipboard</p>
    </div>
    <div id="canvas-wrap" hidden>
      <canvas id="view"></canvas>
      <div id="compare-handle" hidden>
        <div class="ch-line"></div>
        <div class="ch-knob">◂ ▸</div>
      </div>
      <div id="brush-cursor" hidden></div>
    </div>
  </section>

  <aside id="sidebar">
    <div class="panel">
      <div class="panel-head">
        <h2>Filters</h2>
      </div>
      <div class="add-filter">
        <select id="filter-select"></select>
        <button id="btn-add">＋ Add</button>
      </div>
      <div id="stack"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Mask</h2>
      </div>
      <p class="hint">Paint on the image to choose where filters apply.</p>
      <button id="btn-mask-mode" class="wide" disabled>🖌 Paint mask</button>
      <div id="mask-controls" hidden>
        <div class="row radios">
          <label class="radio"><input type="radio" name="mask-tool" value="brush" checked> 🖌 Brush</label>
          <label class="radio"><input type="radio" name="mask-tool" value="lasso"> ⬠ Lasso</label>
        </div>
        <div class="row radios">
          <label class="radio"><input type="radio" name="brush-mode" value="hide" checked> Hide filters</label>
          <label class="radio"><input type="radio" name="brush-mode" value="reveal"> Reveal</label>
        </div>
        <div id="brush-opts">
          <div class="row">
            <label>Size</label>
            <input type="range" id="brush-size" min="5" max="200" value="50">
            <span class="val" id="brush-size-val">50</span>
          </div>
          <div class="row">
            <label>Hardness</label>
            <input type="range" id="brush-hardness" min="0" max="100" value="50">
            <span class="val" id="brush-hardness-val">50</span>
          </div>
          <div class="row">
            <label>Opacity</label>
            <input type="range" id="brush-opacity" min="5" max="100" value="100">
            <span class="val" id="brush-opacity-val">100</span>
          </div>
        </div>
        <div id="lasso-opts" hidden>
          <div class="row">
            <label>Feather</label>
            <input type="range" id="lasso-feather" min="0" max="60" value="8">
            <span class="val" id="lasso-feather-val">8</span>
          </div>
          <p class="hint">Draw around an area and release to fill it.</p>
        </div>
        <div class="row btns">
          <button id="btn-mask-invert">Invert</button>
          <button id="btn-mask-clear">Clear</button>
        </div>
      </div>
    </div>

    <footer class="credits">No AI involved — pure pixel math.</footer>
  </aside>
</main>

<script src="js/filters.js"></script>
<script src="js/app.js"></script>
</body>
</html>
